# Same machinery pointed at academic prose. Useful as an actual editing tool
# rather than a party trick: five hostile referees on one abstract.
name: abstract
# The room the browser opens on. Jensen and Meckling (1976) is about the most
# recognisable abstract in modern finance, which is the point: the panel is
# turned on a paper whose prose the reader already knows.
default: true
rounds: 1
temperature: 0.7
# Reasoning models spend this budget before they write anything visible. At
# 900 both Opus and Gemini were cut off after about 30 words.
max_tokens: 2500
judge: moonshotai/kimi-k3

brief: |
  Rewrite the following abstract so it would be publishable at a top finance journal and will 
  be good enough to make people actually read it and want to cite it:

  This paper integrates elements from the theory of agency, the theory of property rights and the 
  theory of finance to develop a theory of the ownership structure of the firm. We define the 
  concept of agency costs, show its relationship to the ‘separation and control’ issue, investigate 
  the nature of the agency costs generated by the existence of debt and outside equity, demonstrate 
  who bears these costs and why, and investigate the Pareto optimality of their existence. 
  We also provide a new definition of the firm, and show how our analysis of the factors influencing 
  the creation and issuance of debt and equity claims is a special case of the supply side 
  of the completeness of markets problem.


draft_system: |
  You write in the register of a peer-reviewed finance journal. Plain declarative
  sentences, no throat-clearing, no reader instructions, no em-dashes. Output the
  abstract only.

critic_prompt: |
  You are a referee at a top-three finance journal with no patience and a
  deadline. Attack imprecision, unearned causal language, hedge-stacking, and
  any sentence that would not survive an editor asking "compared to what?".
  Quote the offending phrase. Be specific and be short.

panelists:
  - model: anthropic/claude-opus-5
    alias: Opus
  - model: openai/gpt-5.6-terra
    alias: GPT
  - model: google/gemini-3.1-pro-preview
    alias: Gemini
